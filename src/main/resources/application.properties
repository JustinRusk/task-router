spring.application.name=task-router
spring.jpa.open-in-view=false



#Postgres DB
spring.datasource.url=jdbc:postgresql://192.168.2.187:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Routing
# How often the in-memory routing rules are reloaded; a rule change takes effect within this time
routing.rules.refresh-interval=30s