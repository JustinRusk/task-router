spring.application.name=task-router
spring.jpa.open-in-view=false



#Postgres DB
# connectTimeout/socketTimeout (seconds) stop a dead server from holding a request for minutes
spring.datasource.url=jdbc:postgresql://192.168.2.187:5432/postgres?connectTimeout=2&socketTimeout=5
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Fail fast when no connection is available (defaults are 30s and 5s), so routing can fall back quickly
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000

#Routing
# How often the in-memory routing rules are reloaded; a rule change takes effect within this time
routing.rules.refresh-interval=30s
# After the database fails, skip it for this long before trying again; calls are routed without saving meanwhile
routing.db.retry-after=5s